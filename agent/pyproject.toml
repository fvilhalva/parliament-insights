[project]
name = "parliament-agent"
version = "0.1.0"
description = "Agent orchestration + tools layer (LangGraph) for Parliament Insights."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
# Heavy runtime deps are kept optional so CI stays lean; install locally with
#   pip install -e ".[runtime,dev]"
runtime = [
    "langgraph>=0.2",
    "sentence-transformers>=2.6",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
